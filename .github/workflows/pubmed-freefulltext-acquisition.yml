name: PubMed free-full-text acquisition host evidence

on:
  push:
    branches:
      - acquisition-pubmed-freefulltext-20260823
    paths:
      - '.github/workflows/pubmed-freefulltext-acquisition.yml'
      - 'acquisition-runtime/pubmed-freefulltext-20260823/pmids.txt'
      - 'acquisition-runtime/pubmed-freefulltext-20260823/discover_host_evidence.py'
  workflow_dispatch:

jobs:
  discover-host-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: acquisition-pubmed-freefulltext-20260823
      - name: Install host dependencies
        run: python -m pip install --quiet requests
      - name: Collect factual host observations
        run: python acquisition-runtime/pubmed-freefulltext-20260823/discover_host_evidence.py
      - name: Commit host evidence to execution branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add acquisition-runtime/pubmed-freefulltext-20260823/host_evidence.json
          git commit -m 'Record PubMed acquisition host evidence [skip ci]' || exit 0
          git push origin HEAD:acquisition-pubmed-freefulltext-20260823
      - name: Preserve host evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pubmed-freefulltext-host-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            acquisition-runtime/pubmed-freefulltext-20260823/pmids.txt
            acquisition-runtime/pubmed-freefulltext-20260823/host_evidence*.json
